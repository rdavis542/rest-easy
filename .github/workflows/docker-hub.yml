name: Docker Image CI

on:
    workflow_dispatch:
  #push:
  #  branches: [ "main" ]
  #pull_request:
  #  branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Get app version
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "patch=$VERSION" >> $GITHUB_OUTPUT
          echo "minor=${VERSION%.*}" >> $GITHUB_OUTPUT
          echo "major=${VERSION%%.*}" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/rest-easy:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/rest-easy:${{ steps.pkg.outputs.patch }}
            ${{ secrets.DOCKER_USERNAME }}/rest-easy:${{ steps.pkg.outputs.minor }}
            ${{ secrets.DOCKER_USERNAME }}/rest-easy:${{ steps.pkg.outputs.major }}
            ${{ secrets.DOCKER_USERNAME }}/rest-easy:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/rest-easy:cache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/rest-easy:cache,mode=max
        
      #- name: Build the Docker image
      #  run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
